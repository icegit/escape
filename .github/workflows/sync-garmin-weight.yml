name: Sync Garmin weight

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-garmin-weight
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-garmin.txt

      - name: Install Garmin client
        run: python -m pip install -r requirements-garmin.txt

      - name: Test the sync logic
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Fetch Garmin weight and goal
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TARGET_WEIGHT_KG: ${{ secrets.GARMIN_TARGET_WEIGHT_KG }}
        run: python scripts/sync_garmin_weight.py

      - name: Publish changed status
        shell: bash
        run: |
          if git diff --quiet -- health.json; then
            echo "Weight status has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health.json
          git commit -m "chore: sync Garmin weight status"
          git push
